<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belegte Artikel</title>
<meta name="description" content="Gesammelte Artikel, in denen nur belegte Aussagen stehen. Ein Beitrag pro Thema, neueste zuerst.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root {
    --ground:#FBFBFC; --surface:#FFFFFF; --surface-2:#F4F5F8;
    --ink:#141821; --ink-2:#3D4552; --muted:#5A6272;
    --rule:#E4E7EC; --rule-2:#EEF0F4;
    --accent:#1B5E8C; --accent-soft:#E8F0F6;
    --serif:"Source Serif 4", Charter, Georgia, "Times New Roman", serif;
    --sans:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#101318; --surface:#171B22; --surface-2:#1D222B;
      --ink:#E6E9EF; --ink-2:#C3C9D4; --muted:#8A93A4;
      --rule:#252A33; --rule-2:#1E232B;
      --accent:#78B4DC; --accent-soft:#17262F;
    }
  }
  :root[data-theme="dark"] {
    --ground:#101318; --surface:#171B22; --surface-2:#1D222B;
    --ink:#E6E9EF; --ink-2:#C3C9D4; --muted:#8A93A4;
    --rule:#252A33; --rule-2:#1E232B;
    --accent:#78B4DC; --accent-soft:#17262F;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

  .shell { display:grid; grid-template-columns:196px minmax(0,640px) 268px;
    justify-content:center; max-width:1180px; margin:0 auto; }

  .rail { border-right:1px solid var(--rule); padding:22px 18px 40px 8px; }
  .rail-inner { position:sticky; top:22px; display:flex; flex-direction:column; gap:26px; }
  .brand { font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.2; letter-spacing:-.01em; }
  .brand span { display:block; font-family:var(--sans); font-size:11px; font-weight:500;
    text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-top:6px; }
  .rail h2, .aside h2 { font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.09em; color:var(--muted); margin:0 0 10px; }
  .topics { display:flex; flex-direction:column; gap:1px; }
  .topic { appearance:none; border:0; background:none; font:inherit; color:var(--ink-2);
    text-align:left; padding:6px 9px; border-radius:5px; cursor:pointer;
    display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .topic:hover { background:var(--surface-2); }
  .topic[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .topic i { font-style:normal; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .seg { display:inline-flex; background:var(--surface-2); border-radius:6px; padding:2px; gap:2px; }
  .seg button { appearance:none; border:0; background:none; font:inherit; font-size:12.5px;
    font-weight:500; color:var(--muted); padding:4px 11px; border-radius:4px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09); }

  .column { border-right:1px solid var(--rule); background:var(--surface); min-height:100vh; }
  .colhead { position:sticky; top:0; z-index:5; background:var(--surface);
    border-bottom:1px solid var(--rule); padding:13px 22px; min-height:52px;
    display:flex; flex-direction:column; justify-content:center; }
  .colhead h1 { font-size:16px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .colhead p { margin:1px 0 0; font-size:12px; color:var(--muted); }

  .feed { display:flex; flex-direction:column; }
  .post { display:block; text-decoration:none; color:inherit;
    border-bottom:1px solid var(--rule-2); padding:18px 22px 17px; }
  .post:hover { background:var(--surface-2); }
  .post:hover h3 { color:var(--accent); }
  .post-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    font-size:12.5px; color:var(--muted); margin-bottom:5px; }
  .post-topic { color:var(--ink-2); font-weight:500; }
  .dot { color:var(--rule); }
  .post h3 { font-family:var(--serif); font-size:19.5px; font-weight:600; line-height:1.3;
    margin:0 0 5px; letter-spacing:-.01em; text-wrap:balance; color:var(--ink); }
  .post p { margin:0 0 10px; color:var(--ink-2); font-size:14.5px; line-height:1.52; }
  .post-foot { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .lg { display:inline-flex; font-size:10.5px; font-weight:600; letter-spacing:.06em;
    padding:2px 6px; border-radius:4px; background:var(--accent-soft); color:var(--accent); }
  .feed-end { padding:26px 22px 60px; color:var(--muted); font-size:13px; text-align:center; }

  .aside { padding:22px 8px 40px 18px; }
  .aside-inner { position:sticky; top:22px; display:flex; flex-direction:column; gap:20px; }
  .card { background:var(--surface-2); border-radius:8px; padding:14px 15px; }
  .card p { margin:0 0 10px; font-size:12.5px; color:var(--muted); line-height:1.5; }
  .card p:last-child { margin-bottom:0; }
  .card strong { color:var(--ink-2); font-weight:600; }

  @media (max-width:1080px) { .shell { grid-template-columns:196px minmax(0,640px); } .aside { display:none; } }
  @media (max-width:820px) {
    .shell { grid-template-columns:minmax(0,1fr); }
    .rail { border-right:0; border-bottom:1px solid var(--rule); padding:11px 16px; background:var(--ground); }
    .rail-inner { position:static; flex-direction:row; align-items:center; gap:10px; overflow-x:auto; }
    .rail .brand, .rail h2 { display:none; }
    .rail > .rail-inner > div { flex-shrink:0; }
    .topics { flex-direction:row; gap:6px; }
    .topic { white-space:nowrap; border:1px solid var(--rule); border-radius:999px; padding:5px 12px; }
    .topic i { display:none; }
    .column { border-right:0; }
  }
</style>
</head>
<body>

<script type="application/json" id="daten">
<!-- ARTIKEL:ANFANG -->
[
 {
  "datei": "artikel/mongolische-frauen.html",
  "titel": "Mongolische Frauen, dokumentiert",
  "teaser": "Was sich über ihre Stellung belegen lässt: von den Reiseberichten des 13. Jahrhunderts über die Verfassung von 1924 bis zu den Erhebungen der Gegenwart.",
  "thema": "Geschichte und Gesellschaft",
  "datum": "2026-08-30",
  "sprachen": [
   "de",
   "en",
   "mn"
  ],
  "belege": 15,
  "bytes": 1253178
 }
]
<!-- ARTIKEL:ENDE -->
</script>

<div class="shell">
  <nav class="rail" aria-label="Themen">
    <div class="rail-inner">
      <div class="brand">Belegte Artikel<span id="brandSub">Faktencheck zuerst</span></div>
      <div>
        <h2 id="topicsLabel">Themen</h2>
        <div class="topics" id="topics" role="group" aria-labelledby="topicsLabel"></div>
      </div>
      <div>
        <h2 id="langLabel">Sprache</h2>
        <div class="seg" role="group" aria-labelledby="langLabel">
          <button type="button" data-ui="de" aria-pressed="true">DE</button>
          <button type="button" data-ui="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="column">
    <div class="colhead" id="colhead"></div>
    <div class="feed" id="feed"></div>
    <div class="feed-end" id="feedEnd"></div>
  </main>

  <aside class="aside" aria-label="Zur Sammlung">
    <div class="aside-inner">
      <div class="card" id="methode"></div>
    </div>
  </aside>
</div>

<script>
"use strict";

const T = {
  de: {
    sub:"Faktencheck zuerst", topics:"Themen", lang:"Sprache", all:"Alle",
    head:"Beiträge",
    sub2:n => n === 1 ? "1 Beitrag" : n + " Beiträge",
    newest:"neueste zuerst",
    belege:n => n === 1 ? "1 Beleg" : n + " Belege",
    end:"Ende der Sammlung.",
    leer:"Noch keine Artikel. Lege eine HTML-Datei in den Ordner artikel/ und lass werkzeuge/feed-bauen.py laufen.",
    mTitel:"Wie diese Sammlung entsteht",
    m1:"Zuerst entsteht eine <strong>Faktencheck-Fassung</strong>: Befunde einzeln, jeder mit Quelle und Quellenrang.",
    m2:"Daraus wird der Artikel geschrieben. Darin steht nur, was in der Faktencheck-Fassung belegt ist.",
    m3:"Jeder Artikel ist eine eigenständige Seite mit eigener Belegliste. Diese Übersicht wird aus den Artikeldateien erzeugt, nicht von Hand gepflegt."
  },
  en: {
    sub:"Fact-check first", topics:"Topics", lang:"Language", all:"All",
    head:"Posts",
    sub2:n => n === 1 ? "1 post" : n + " posts",
    newest:"newest first",
    belege:n => n === 1 ? "1 source" : n + " sources",
    end:"End of the collection.",
    leer:"No articles yet. Drop an HTML file into artikel/ and run werkzeuge/feed-bauen.py.",
    mTitel:"How this collection is made",
    m1:"A <strong>fact-check pass</strong> comes first: findings one by one, each with its source and evidence tier.",
    m2:"The article is written from that. It states only what the fact-check pass supports.",
    m3:"Every article is a standalone page with its own reference list. This index is generated from the article files, not maintained by hand."
  }
};

let ui = "de";
let thema = "__alle";

const ART = (() => {
  const roh = document.getElementById("daten").textContent
    .replace(/<!--[\s\S]*?-->/g, "").trim();
  try { return JSON.parse(roh || "[]") || []; }
  catch (e) { console.error("Artikeldaten unlesbar:", e); return []; }
})();

const esc = s => String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const datum = d => {
  const p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
  if (!p) return d || "";
  const dt = new Date(Date.UTC(+p[1], +p[2] - 1, +p[3]));
  return dt.toLocaleDateString(ui === "de" ? "de-DE" : "en-GB",
    { year:"numeric", month:"long", day:"numeric", timeZone:"UTC" });
};

const passend = a => thema === "__alle" || a.thema === thema;

function zeichnen() {
  const t = T[ui];
  document.documentElement.lang = ui;
  document.getElementById("brandSub").textContent = t.sub;
  document.getElementById("topicsLabel").textContent = t.topics;
  document.getElementById("langLabel").textContent = t.lang;

  const zahl = new Map();
  ART.forEach(a => zahl.set(a.thema, (zahl.get(a.thema) || 0) + 1));
  const eintraege = [["__alle", t.all, ART.length]];
  zahl.forEach((n, k) => eintraege.push([k, k, n]));
  document.getElementById("topics").innerHTML = eintraege.map(([k, label, n]) =>
    `<button type="button" class="topic" data-thema="${esc(k)}" aria-pressed="${k === thema}">
       <span>${esc(label)}</span><i>${n}</i></button>`).join("");

  document.getElementById("methode").innerHTML =
    `<h2>${esc(t.mTitel)}</h2><p>${t.m1}</p><p>${t.m2}</p><p>${t.m3}</p>`;

  const liste = ART.filter(passend);
  document.getElementById("colhead").innerHTML =
    `<h1>${esc(t.head)}</h1><p>${esc(t.sub2(liste.length))} · ${esc(t.newest)}</p>`;

  document.getElementById("feed").innerHTML = liste.map(a => `
    <a class="post" href="${esc(a.datei)}">
      <div class="post-meta">
        <span class="post-topic">${esc(a.thema)}</span>
        <span class="dot">·</span><span>${esc(datum(a.datum))}</span>
      </div>
      <h3>${esc(a.titel)}</h3>
      <p>${esc(a.teaser)}</p>
      <div class="post-foot">
        ${(a.sprachen || []).map(s => `<span class="lg">${esc(s.toUpperCase())}</span>`).join("")}
        ${a.belege ? `<span>${esc(t.belege(a.belege))}</span>` : ""}
      </div>
    </a>`).join("");

  document.getElementById("feedEnd").textContent = ART.length ? t.end : t.leer;
}

document.addEventListener("click", e => {
  const tp = e.target.closest(".topic");
  if (tp) { thema = tp.dataset.thema; zeichnen(); return; }
  const lg = e.target.closest("[data-ui]");
  if (lg) {
    ui = lg.dataset.ui;
    document.querySelectorAll("[data-ui]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.ui === ui)));
    zeichnen();
  }
});

zeichnen();
</script>
</body>
</html>
