<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Feed belegter Artikel: ein Post pro Thema, Klick oeffnet den vollen Artikel mit nummerierter Belegliste und Quellenrang.">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Belegte Artikel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root {
    --ground:#FBFBFC; --surface:#FFFFFF; --surface-2:#F4F5F8;
    --ink:#141821; --ink-2:#3D4552; --muted:#5A6272;
    --rule:#E4E7EC; --rule-2:#EEF0F4;
    --accent:#1B5E8C; --accent-soft:#E8F0F6;
    --tier-peer:#2E6B4F; --tier-peer-bg:#E7F1EC;
    --tier-official:#1B5E8C; --tier-official-bg:#E8F0F6;
    --tier-preprint:#8A6A1F; --tier-preprint-bg:#F6EFDE;
    --focus:#1B5E8C;
    --serif:"Source Serif 4", Charter, Georgia, "Times New Roman", serif;
    --sans:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#101318; --surface:#171B22; --surface-2:#1D222B;
      --ink:#E6E9EF; --ink-2:#C3C9D4; --muted:#8A93A4;
      --rule:#252A33; --rule-2:#1E232B;
      --accent:#78B4DC; --accent-soft:#17262F;
      --tier-peer:#7FC5A2; --tier-peer-bg:#16261E;
      --tier-official:#78B4DC; --tier-official-bg:#152532;
      --tier-preprint:#D9B866; --tier-preprint-bg:#292213;
      --focus:#78B4DC;
    }
  }
  :root[data-theme="dark"] {
    --ground:#101318; --surface:#171B22; --surface-2:#1D222B;
    --ink:#E6E9EF; --ink-2:#C3C9D4; --muted:#8A93A4;
    --rule:#252A33; --rule-2:#1E232B;
    --accent:#78B4DC; --accent-soft:#17262F;
    --tier-peer:#7FC5A2; --tier-peer-bg:#16261E;
    --tier-official:#78B4DC; --tier-official-bg:#152532;
    --tier-preprint:#D9B866; --tier-preprint-bg:#292213;
    --focus:#78B4DC;
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:2px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  .shell {
    display:grid; grid-template-columns:196px minmax(0,640px) 268px;
    gap:0; justify-content:center; max-width:1180px; margin:0 auto;
  }

  /* ---------- left rail ---------- */
  .rail { border-right:1px solid var(--rule); padding:22px 18px 40px 8px; }
  .rail-inner { position:sticky; top:22px; display:flex; flex-direction:column; gap:26px; }
  .brand { font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-.01em; line-height:1.2; }
  .brand span { display:block; font-family:var(--sans); font-size:11px; font-weight:500;
    text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-top:6px; }
  .rail h2, .aside h2 {
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); margin:0 0 10px;
  }
  .topics { display:flex; flex-direction:column; gap:1px; }
  .topic {
    appearance:none; border:0; background:none; font:inherit; color:var(--ink-2);
    text-align:left; padding:6px 9px; border-radius:5px; cursor:pointer;
    display:flex; justify-content:space-between; gap:8px; align-items:baseline;
  }
  .topic:hover { background:var(--surface-2); }
  .topic[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .topic i { font-style:normal; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .topic[aria-pressed="true"] i { color:var(--accent); }

  /* ---------- centre feed ---------- */
  .column { border-right:1px solid var(--rule); background:var(--surface); min-height:100vh; }
  .colhead {
    position:sticky; top:0; z-index:5; background:var(--surface);
    border-bottom:1px solid var(--rule); padding:13px 22px;
    display:flex; align-items:center; gap:12px; min-height:52px;
  }
  .colhead h1 { font-size:16px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .colhead p { margin:1px 0 0; font-size:12px; color:var(--muted); }
  .back {
    appearance:none; border:1px solid var(--rule); background:var(--surface);
    color:var(--ink); font:inherit; font-size:13px; cursor:pointer;
    border-radius:999px; padding:5px 13px 5px 9px; display:inline-flex; align-items:center; gap:5px;
    flex-shrink:0;
  }
  .back:hover { background:var(--surface-2); }
  .spacer { flex:1; }

  .feed { display:flex; flex-direction:column; }
  .post {
    display:block; width:100%; text-align:left; appearance:none; background:none;
    border:0; border-bottom:1px solid var(--rule-2); font:inherit; color:inherit;
    padding:18px 22px 17px; cursor:pointer;
  }
  .post:hover { background:var(--surface-2); }
  .post-meta {
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    font-size:12.5px; color:var(--muted); margin-bottom:5px;
  }
  .post-topic { color:var(--ink-2); font-weight:500; }
  .dot { color:var(--rule); }
  .post h3 {
    font-family:var(--serif); font-size:19.5px; font-weight:600; line-height:1.3;
    margin:0 0 5px; letter-spacing:-.01em; text-wrap:balance; color:var(--ink);
  }
  .post p { margin:0 0 10px; color:var(--ink-2); font-size:14.5px; line-height:1.52; }
  .post-foot { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:12px; color:var(--muted); }

  .tier {
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500;
    padding:2px 7px; border-radius:4px; white-space:nowrap;
  }
  .tier::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
  .tier.peer     { color:var(--tier-peer);     background:var(--tier-peer-bg); }
  .tier.official { color:var(--tier-official); background:var(--tier-official-bg); }
  .tier.preprint { color:var(--tier-preprint); background:var(--tier-preprint-bg); }

  .feed-end { padding:26px 22px 60px; color:var(--muted); font-size:13px; text-align:center; }

  /* ---------- article ---------- */
  .article { padding:26px 30px 70px; }
  .article .kicker {
    font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.09em;
    color:var(--accent); margin-bottom:9px;
  }
  .article h2 {
    font-family:var(--serif); font-size:31px; font-weight:600; line-height:1.2;
    margin:0 0 12px; letter-spacing:-.015em; text-wrap:balance;
  }
  .byline {
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12.5px;
    color:var(--muted); padding-bottom:18px; border-bottom:1px solid var(--rule); margin-bottom:22px;
  }
  .article .body { font-family:var(--serif); font-size:17.5px; line-height:1.62; color:var(--ink); }
  .article .body p { margin:0 0 17px; max-width:62ch; }
  .article .body strong { font-weight:600; }
  .cite {
    font-family:var(--sans); font-size:11.5px; font-weight:500; vertical-align:super;
    line-height:0; color:var(--accent); text-decoration:none; padding:0 1px;
  }
  .cite:hover { text-decoration:underline; }

  .lede {
    font-family:var(--sans); font-size:15.5px; line-height:1.55; color:var(--ink-2);
    background:var(--surface-2); border-radius:7px; padding:15px 17px; margin:0 0 22px; max-width:none;
  }

  figure { margin:24px 0 26px; }
  figcaption { font-family:var(--sans); font-size:12px; color:var(--muted); margin-top:11px; line-height:1.45; }
  .chart { display:flex; flex-direction:column; gap:11px; }
  .row { display:grid; grid-template-columns:132px 1fr auto; align-items:center; gap:12px; }
  .row .lab { font-family:var(--sans); font-size:13px; color:var(--ink-2); }
  .track { background:var(--surface-2); border-radius:3px; height:22px; overflow:hidden; }
  .bar { height:100%; border-radius:3px; background:var(--accent); }
  .bar.q2 { background:var(--tier-peer); }
  .bar.q3 { background:var(--muted); }
  .row .val {
    font-family:var(--sans); font-size:13px; font-weight:600; color:var(--ink);
    font-variant-numeric:tabular-nums; min-width:44px; text-align:right;
  }

  .sources { margin-top:34px; padding-top:22px; border-top:1px solid var(--rule); }
  .sources h3 { font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 14px; }
  .sources ol { margin:0; padding:0; list-style:none; counter-reset:src; display:flex; flex-direction:column; gap:13px; }
  .sources li { counter-increment:src; display:grid; grid-template-columns:24px 1fr; gap:10px; font-size:13.5px; line-height:1.5; color:var(--ink-2); }
  .sources li::before {
    content:counter(src); font-size:11.5px; font-weight:600; color:var(--muted);
    font-variant-numeric:tabular-nums; padding-top:2px;
  }
  .sources a { word-break:break-word; }
  .sources .st { display:block; margin-top:4px; }

  /* ---------- right aside ---------- */
  .aside { padding:22px 8px 40px 18px; }
  .aside-inner { position:sticky; top:22px; display:flex; flex-direction:column; gap:24px; }
  .card { background:var(--surface-2); border-radius:8px; padding:14px 15px; }
  .card h2 { margin-bottom:11px; }
  .legend { display:flex; flex-direction:column; gap:10px; }
  .legend div { font-size:12.5px; color:var(--muted); line-height:1.4; }
  .legend .tier { margin-bottom:3px; }
  .seg { display:inline-flex; background:var(--surface-2); border-radius:6px; padding:2px; gap:2px; }
  .seg button {
    appearance:none; border:0; background:none; font:inherit; font-size:12.5px; font-weight:500;
    color:var(--muted); padding:4px 11px; border-radius:4px; cursor:pointer;
  }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09); }
  .note { font-size:12px; color:var(--muted); line-height:1.5; }

  @media (max-width:1080px) { .shell { grid-template-columns:196px minmax(0,640px); } .aside { display:none; } }
  @media (max-width:820px) {
    .shell { grid-template-columns:minmax(0,1fr); }
    .rail { border-right:0; border-bottom:1px solid var(--rule); padding:11px 16px; background:var(--ground); }
    .rail-inner { position:static; flex-direction:row; align-items:center; gap:10px; overflow-x:auto; }
    .rail .brand, .rail h2 { display:none; }
    .rail > .rail-inner > div { flex-shrink:0; }
    .topics { flex-direction:row; gap:6px; }
    .topic { white-space:nowrap; border:1px solid var(--rule); border-radius:999px; padding:5px 12px; }
    .topic i { display:none; }
    .column { border-right:0; }
    .article { padding:22px 20px 60px; }
    .article h2 { font-size:26px; }
    .row { grid-template-columns:104px 1fr auto; }
  }
</style>

</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Themen">
    <div class="rail-inner">
      <div class="brand">Belegte Artikel<span id="brandSub">Faktencheck zuerst</span></div>
      <div>
        <h2 id="topicsLabel">Themen</h2>
        <div class="topics" id="topics" role="group" aria-labelledby="topicsLabel"></div>
      </div>
      <div>
        <h2 id="langLabel">Sprache</h2>
        <div class="seg" role="group" aria-labelledby="langLabel">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="column">
    <div class="colhead" id="colhead"></div>
    <div id="view"></div>
  </main>

  <aside class="aside" aria-label="Belegränge">
    <div class="aside-inner">
      <div class="card">
        <h2 id="legendTitle">Belegrang</h2>
        <div class="legend" id="legend"></div>
      </div>
      <p class="note" id="asideNote"></p>
    </div>
  </aside>
</div>

    }

};

const ARTICLES = [
  {

    lede:{de:"Wer mit einer Rückkehr auf das Niveau von 2019 plant, plant gegen die Daten. Zugleich arbeitet die Mehrheit der Beschäftigten weiterhin vollständig vor Ort. Beide Hälften dieses Satzes zählen.",

        "Die Aufteilung der Beschäftigten korrigiert eine verbreitete Fehlvorstellung. In den zwölf Monaten bis Mai 2026 arbeiteten <strong>62 %</strong> vollständig vor Ort, <strong>26 %</strong> hybrid und <strong>12 %</strong> vollständig remote.<a class='cite' href='#s1'>1</a> Homeoffice ist damit eine große Minderheitenerfahrung, konzentriert auf einen Teil der Berufe, nicht der Normalfall.",

      en:[
        "In May 2026, 25% of all paid full days in the United States were worked from home.<a class='cite' href='#s1'>1</a> The 2019 comparison is 5.4% of workdays. The jump is roughly forty years of the series' pre-pandemic annual growth, compressed into a few months.",

let lang = "de";
let topic = "__all";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byDate = (a,b) => b.date.localeCompare(a.date);
const sorted = () => ARTICLES.slice().sort(byDate);
const inTopic = a => topic === "__all" || a.topic.de === topic;

function tierChip(k) { return `<span class="tier ${k}">${esc(T[lang].tiers[k][0])}</span>`; }

function renderRail() {
  const t = T[lang];
  $("#brandSub").textContent = t.sub;
  $("#topicsLabel").textContent = t.topics;
  $("#langLabel").textContent = t.lang;
  $("#legendTitle").textContent = t.legend;
  $("#asideNote").textContent = t.note;

  const counts = new Map();
  sorted().forEach(a => counts.set(a.topic.de, (counts.get(a.topic.de) || 0) + 1));
  const keys = [["__all", t.all, ARTICLES.length]];
  counts.forEach((n, k) => {
    const label = sorted().find(a => a.topic.de === k).topic[lang];
    keys.push([k, label, n]);
  });
  $("#topics").innerHTML = keys.map(([k, label, n]) =>
    `<button type="button" class="topic" data-topic="${esc(k)}" aria-pressed="${k === topic}">
       <span>${esc(label)}</span><i>${n}</i></button>`).join("");

  $("#legend").innerHTML = ["peer","official","preprint"].map(k =>
    `<div>${tierChip(k)}${esc(t.tiers[k][1])}</div>`).join("");
}

function renderFeed(scroll) {
  const t = T[lang];
  const list = sorted().filter(inTopic);
  $("#colhead").innerHTML =
    `<div><h1>${esc(t.feedTitle)}</h1><p>${esc(t.feedSub(list.length))}</p></div>`;
  $("#view").innerHTML =
    `<div class="feed">` + list.map(a => `
      <button type="button" class="post" data-id="${esc(a.id)}">
        <div class="post-meta">
          <span class="post-topic">${esc(a.topic[lang])}</span>
          <span class="dot">·</span><span>${esc(a.stamp[lang])}</span>
          <span class="dot">·</span><span>${a.read} ${esc(t.read)}</span>
        </div>
        <h3>${esc(a.title[lang])}</h3>
        <p>${esc(a.teaser[lang])}</p>
        <div class="post-foot">${tierChip(a.tier)}<span>${esc(t.srcCount(a.sources.length))}</span></div>
      </button>`).join("") +
    `</div><div class="feed-end">${esc(t.end)}</div>`;
  if (scroll !== false) window.scrollTo(0, 0);
}

function renderArticle(id) {
  const t = T[lang], a = ARTICLES.find(x => x.id === id);
  if (!a) return renderFeed();
  $("#colhead").innerHTML =
    `<button type="button" class="back" id="backBtn">← ${esc(t.back)}</button>
     <div class="spacer"></div><p>${esc(a.topic[lang])}</p>`;

  let chart = "";
  if (a.chart) {
    chart = `<figure><div class="chart">` + a.chart.rows.map(r => {
      const pct = Math.max(1.5, (r.v / a.chart.max) * 100);
      const num = r.u === "%" ? r.v.toLocaleString(lang === "de" ? "de-DE" : "en-US")
                              : r.v.toLocaleString(lang === "de" ? "de-DE" : "en-US",
                                  {minimumFractionDigits:2, maximumFractionDigits:2});
      return `<div class="row">
          <div class="lab">${esc(r.lab[lang])}</div>
          <div class="track"><div class="bar ${r.s}" style="width:${pct.toFixed(1)}%"></div></div>
          <div class="val">${esc(num)}${esc(r.u)}</div>
        </div>`;
    }).join("") + `</div><figcaption>${esc(a.chart.caption[lang])}</figcaption></figure>`;
  }

  $("#view").innerHTML = `<article class="article">
      <div class="kicker">${esc(a.topic[lang])}</div>
      <h2>${esc(a.title[lang])}</h2>
      <div class="byline">${tierChip(a.tier)}<span>${esc(a.stamp[lang])}</span>
        <span class="dot">·</span><span>${a.read} ${esc(t.read)}</span>
        <span class="dot">·</span><span>${esc(t.srcCount(a.sources.length))}</span></div>
      <p class="lede">${esc(a.lede[lang])}</p>
      <div class="body">${a.body[lang].slice(0, 2).map(p => `<p>${p}</p>`).join("")}</div>
      ${chart}
      <div class="body">${a.body[lang].slice(2).map(p => `<p>${p}</p>`).join("")}</div>
      <div class="sources">
        <h3>${esc(t.sources)}</h3>
        <ol>${a.sources.map((s,i) => `<li id="s${i+1}"><div>
            <a href="${esc(s.u)}" target="_blank" rel="noopener noreferrer">${esc(s.t)}</a>
            <span class="st">${esc(s.d[lang])} ${tierChip(s.tier)}</span>
          </div></li>`).join("")}</ol>
      </div>
    </article>`;
  window.scrollTo(0, 0);
}

let current = null;
function show(id) { current = id; id ? renderArticle(id) : renderFeed(); }

document.addEventListener("click", e => {
  const post = e.target.closest(".post");
  if (post) { show(post.dataset.id); return; }
  if (e.target.closest("#backBtn")) { show(null); return; }
  const tp = e.target.closest(".topic");
  if (tp) { topic = tp.dataset.topic; renderRail(); show(null); return; }
  const lg = e.target.closest("[data-lang]");
  if (lg) {
    lang = lg.dataset.lang;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-lang]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    renderRail(); current ? renderArticle(current) : renderFeed(false);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && current) show(null); });

renderRail();
renderFeed();
</script>
